version: "3.9"

services:
  laravelapp:
    container_name: laravel-11
    build: .
    restart: always
    ports:
      - "8021:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
    networks:
      - laravel
    environment:
      - DB_HOST=mysql

  mysql:
    container_name: mysql
    image: mysql:8.0
    restart: always
    ports:
      - "3308:3306"
    command: --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_DATABASE=erp_colossal
      - MYSQL_ROOT_PASSWORD=ctapps123  # Root password
    volumes:
      - ./dump:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/mysql
    networks:
      - laravel

  phpmyadmin:
    image: phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      - PMA_HOST=mysql
    networks:
      - laravel

volumes:
  pgdata: {}

networks:
  laravel: